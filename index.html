<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no">

<title>Bizim Evrenimiz</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

body{
    touch-action:none;
    font-family:Arial,Helvetica,sans-serif;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
}


/* ------------------------------------------------
   GİRİŞ YAZISI
------------------------------------------------ */

#intro{

    position:fixed;

    inset:0;

    display:flex;

    align-items:center;

    justify-content:center;

    text-align:center;

    color:#d9d6e2;

    font-size:
        clamp(
            17px,
            4.5vw,
            28px
        );

    letter-spacing:
        .20em;

    pointer-events:none;

    animation:
        intro 5s ease forwards;

    text-shadow:
        0 0 12px
        rgba(170,120,255,.5),

        0 0 35px
        rgba(100,60,255,.25);
}


@keyframes intro{

    0%{
        opacity:0;
        transform:scale(.96);
    }

    20%{
        opacity:1;
        transform:scale(1);
    }

    75%{
        opacity:1;
    }

    100%{
        opacity:0;
        transform:scale(1.03);
    }

}


/* ------------------------------------------------
   ALT YAZI
------------------------------------------------ */

#hint{

    position:fixed;

    left:0;
    right:0;

    bottom:17px;

    text-align:center;

    color:
        rgba(
            255,
            255,
            255,
            .35
        );

    font-size:10px;

    letter-spacing:.10em;

    pointer-events:none;

    transition:
        opacity .8s;

}


/* ------------------------------------------------
   BÜYÜYEN MESAJ
------------------------------------------------ */

#message{

    position:fixed;

    z-index:50;

    left:50%;
    top:50%;

    width:
        min(
            88vw,
            520px
        );

    padding:
        32px 22px;

    transform:
        translate(-50%,-50%)
        scale(.55);

    opacity:0;

    pointer-events:none;

    text-align:center;

    color:#fff;

    font-size:
        clamp(
            23px,
            7vw,
            44px
        );

    line-height:1.25;

    background:
        rgba(
            5,
            3,
            14,
            .92
        );

    border:
        1px solid
        rgba(
            205,
            170,
            255,
            .3
        );

    border-radius:25px;

    box-shadow:

        0 0 35px
        rgba(
            145,
            75,
            255,
            .35
        ),

        0 0 100px
        rgba(
            100,
            50,
            255,
            .15
        );

    backdrop-filter:
        blur(18px);

    transition:
        opacity .28s ease,
        transform .28s ease;

}


#message.show{

    opacity:1;

    transform:
        translate(-50%,-50%)
        scale(1);

    pointer-events:auto;

}


#message small{

    display:block;

    margin-top:16px;

    color:
        rgba(
            255,
            255,
            255,
            .38
        );

    font-size:10px;

}


/* ------------------------------------------------
   EKRAN KARARTMA
------------------------------------------------ */

#vignette{

    position:fixed;

    inset:0;

    pointer-events:none;

    background:
        radial-gradient(
            ellipse at center,
            transparent 30%,
            rgba(0,0,0,.35) 72%,
            rgba(0,0,0,.75) 100%
        );

}

</style>

</head>


<body>


<canvas id="canvas"></canvas>


<div id="intro">
    EVRENİNDE BİR SIR VAR...
</div>


<div id="message"></div>


<div id="hint">
    DÖNDÜR • KEŞFET • MESAJLARA DOKUN
</div>


<div id="vignette"></div>



<script>


/* =====================================================
   MESAJLAR
===================================================== */

const messages = [

    "SENİ SEVİYORUM ❤️",

    "İYİ Kİ HAYATIMA GİRDİN ✨",

    "İYİ Kİ VARSIN 💜",

    "SEN BENİM EN GÜZEL TESADÜFÜMSÜN 🌙",

    "SENİNLE HER ŞEY DAHA GÜZEL ♡",

    "İYİ Kİ SENİ TANIDIM 🫶",

    "GÜLÜŞÜN DÜNYAMIN EN GÜZEL YERİ ✨",

    "SEN BENİM EN GÜZEL HİKAYEMSİN 📖",

    "UZAKTA OLSAN DA KALBİMDESİN ❤️",

    "HER GÜN SENİ DAHA ÇOK SEVİYORUM 💜",

    "SENİNLE GEÇEN HER AN ÇOK DEĞERLİ 🌙",

    "İYİ Kİ BİZ VARIZ ♾️",

    "KALBİMİN EN GÜZEL YERİ SENİN 💗",

    "SEN BENİM EVİMSİN 🏡",

    "SONSUZA KADAR SEN ♡"

];


/* =====================================================
   CANVAS
===================================================== */

const canvas =
    document.getElementById(
        "canvas"
    );

const ctx =
    canvas.getContext(
        "2d"
    );


let W = 0;
let H = 0;
let DPR = 1;


function resize(){

    DPR =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    W =
        window.innerWidth;


    H =
        window.innerHeight;


    canvas.width =
        W * DPR;


    canvas.height =
        H * DPR;


    canvas.style.width =
        W + "px";


    canvas.style.height =
        H + "px";


    ctx.setTransform(
        DPR,
        0,
        0,
        DPR,
        0,
        0
    );

}


resize();


window.addEventListener(
    "resize",
    resize
);



/* =====================================================
   GALAKSİ PARÇACIKLARI
===================================================== */

const particles = [];


/*
   Telefonu fazla yormamak için
   parçacık sayısını ekrana göre ayarlıyoruz.
*/

const PARTICLE_COUNT =
    W < 600
    ? 6500
    : 10000;


for(
    let i=0;
    i<PARTICLE_COUNT;
    i++
){

    const arm =
        Math.floor(
            Math.random()*6
        );


    const radius =
        Math.pow(
            Math.random(),
            .64
        )
        *
        470;


    /*
       Spiral kıvrımı
    */

    const angle =

        arm *
        Math.PI *
        2 /
        6

        +

        radius *
        .012

        +

        (
            Math.random()-.5
        )
        *
        (
            .12+
            radius*.0008
        );


    particles.push({

        radius,

        angle,

        depth:
            (
                Math.random()-.5
            ),

        size:
            .35+
            Math.random()*1.55,

        brightness:
            .25+
            Math.random()*.75,

        color:
            Math.random(),

        speed:
            .0002+
            Math.random()*.0008

    });

}



/* =====================================================
   ARKA PLAN YILDIZLARI
===================================================== */

const stars = [];


for(
    let i=0;
    i<1200;
    i++
){

    stars.push({

        x:
            Math.random()*W,

        y:
            Math.random()*H,

        size:
            .15+
            Math.random()*1.2,

        opacity:
            .15+
            Math.random()*.65

    });

}



/* =====================================================
   ROTATION
===================================================== */

let rotationX =
    .38;


let rotationY =
    0;


let targetX =
    .38;


let targetY =
    0;


let touching =
    false;


let moved =
    false;


let startX =
    0;


let startY =
    0;


let lastX =
    0;


let lastY =
    0;


let autoRotation =
    true;



/* =====================================================
   MESAJLARIN KONUMU
===================================================== */

const messagePoints = [];


function createMessagePoints(){

    messagePoints.length=0;


    const radius =
        Math.min(
            W,
            H
        )
        *
        .37;


    for(
        let i=0;
        i<messages.length;
        i++
    ){

        messagePoints.push({

            angle:

                (
                    i /
                    messages.length
                )
                *
                Math.PI
                *
                2,

            radius:

                radius +
                (
                    i%3
                )
                *
                22

        });

    }

}


createMessagePoints();


/* =====================================================
   MESAJ KUTUSU
===================================================== */

const messageBox =
    document.getElementById(
        "message"
    );


function openMessage(text){

    messageBox.innerHTML =
        text
        +
        "<small>" +
        "Başka bir yere dokunarak kapat" +
        "</small>";


    messageBox.classList.add(
        "show"
    );

}


function closeMessage(){

    messageBox.classList.remove(
        "show"
    );

}



/* =====================================================
   MESAJ KONTROLÜ
===================================================== */

function checkMessages(
    px,
    py
){

    for(
        let i=0;
        i<messagePoints.length;
        i++
    ){

        const m =
            messagePoints[i];


        const angle =
            m.angle+
            rotationY;


        const x =
            W/2
            +
            Math.cos(angle)
            *
            m.radius;


        const y =
            H/2
            +
            Math.sin(angle)
            *
            m.radius
            *
            .43;


        const distance =

            Math.sqrt(

                Math.pow(
                    px-x,
                    2
                )

                +

                Math.pow(
                    py-y,
                    2
                )

            );


        /*
          Yazılar küçük olduğu için
          dokunma alanını yazının
          kendisinden biraz büyük tutuyoruz.
        */

        if(
            distance <
            55
        ){

            openMessage(
                messages[i]
            );

            return true;

        }

    }


    return false;

}



/* =====================================================
   PARMAK / MOUSE
===================================================== */

canvas.addEventListener(
    "pointerdown",
    e=>{

        touching=true;

        moved=false;

        autoRotation=false;


        startX=
            lastX=
            e.clientX;


        startY=
            lastY=
            e.clientY;

    }
);


canvas.addEventListener(
    "pointermove",
    e=>{

        if(!touching)
            return;


        const dx =
            e.clientX-
            lastX;


        const dy =
            e.clientY-
            lastY;


        if(

            Math.abs(
                e.clientX-
                startX
            )

            +

            Math.abs(
                e.clientY-
                startY
            )

            >
            8

        ){

            moved=true;

        }


        targetY +=
            dx*.007;


        targetX +=
            dy*.004;


        targetX =
            Math.max(
                -.9,
                Math.min(
                    .9,
                    targetX
                )
            );


        lastX=
            e.clientX;


        lastY=
            e.clientY;

    }
);


canvas.addEventListener(
    "pointerup",
    e=>{

        touching=false;


        if(!moved){

            const clicked =
                checkMessages(
                    e.clientX,
                    e.clientY
                );


            if(!clicked){

                closeMessage();

            }

        }


        setTimeout(
            ()=>{
                autoRotation=true;
            },
            600
        );

    }
);



/* =====================================================
   MESAJ PENCERESİ
===================================================== */

messageBox.addEventListener(
    "pointerdown",
    e=>{
        e.stopPropagation();
    }
);



/* =====================================================
   YILDIZLAR
===================================================== */

function drawStars(){

    const now =
        performance.now()*.001;


    for(
        const s of stars
    ){

        const flicker =
            .7+
            Math.sin(
                now*1.5+
                s.x
            )
            *.3;


        ctx.fillStyle =
            `rgba(
                255,
                255,
                255,
                ${s.opacity*flicker}
            )`;


        ctx.beginPath();


        ctx.arc(
            s.x,
            s.y,
            s.size,
            0,
            Math.PI*2
        );


        ctx.fill();

    }

}



/* =====================================================
   GALAKSİ
===================================================== */

function drawGalaxy(){

    const cx =
        W/2;


    const cy =
        H/2;


    const scale =
        Math.min(
            W,
            H
        )
        /
        900;


    /*
       Daha gerçekçi görünmesi için
       dış parçacıkları azaltıyoruz.
    */

    for(
        const p of particles
    ){

        const a =
            p.angle+
            rotationY;


        const r =
            p.radius*
            scale;


        const flatX =
            Math.cos(a)*
            r;


        const flatY =
            Math.sin(a)*
            r;


        /*
           3D eğim
        */

        const vertical =

            flatY*
            Math.cos(
                rotationX
            )

            -

            p.depth*
            r*
            .32*
            Math.sin(
                rotationX
            );


        const depth =

            flatY*
            Math.sin(
                rotationX
            )

            +

            p.depth*
            r*
            .32*
            Math.cos(
                rotationX
            );


        /*
           Perspektif
        */

        const perspective =

            1/
            (
                1+
                depth*.0018
            );


        const x =
            cx+
            flatX*
            perspective;


        const y =
            cy+
            vertical*
            perspective;


        /*
           Merkeze yakın
           parçacıklar daha parlak
        */

        const centerFactor =

            Math.max(
                0,
                1-
                p.radius/470
            );


        const brightness =

            p.brightness*
            (
                .55+
                centerFactor*.8
            );


        let rColor;
        let gColor;
        let bColor;


        if(
            p.color<.48
        ){

            rColor=115;
            gColor=55;
            bColor=255;

        }

        else if(
            p.color<.78
        ){

            rColor=255;
            gColor=70;
            bColor=180;

        }

        else if(
            p.color<.92
        ){

            rColor=255;
            gColor=170;
            bColor=75;

        }

        else{

            rColor=255;
            gColor=230;
            bColor=180;

        }


        ctx.fillStyle =

            `rgba(
                ${rColor},
                ${gColor},
                ${bColor},
                ${brightness}
            )`;


        ctx.beginPath();


        ctx.arc(
            x,
            y,
            p.size*
            perspective,
            0,
            Math.PI*2
        );


        ctx.fill();

    }

}



/* =====================================================
   KARA DELİK
===================================================== */

function drawBlackHole(){

    const cx =
        W/2;


    const cy =
        H/2;


    const radius =
        Math.min(
            W,
            H
        )
        *
        .17;


    /*
       Büyük mor halo
    */

    const halo =
        ctx.createRadialGradient(
            cx,
            cy,
            0,
            cx,
            cy,
            radius
        );


    halo.addColorStop(
        0,
        "rgba(0,0,0,1)"
    );


    halo.addColorStop(
        .30,
        "rgba(5,1,15,1)"
    );


    halo.addColorStop(
        .50,
        "rgba(120,45,255,.35)"
    );


    halo.addColorStop(
        .72,
        "rgba(255,90,180,.10)"
    );


    halo.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );


    ctx.fillStyle =
        halo;


    ctx.beginPath();


    ctx.arc(
        cx,
        cy,
        radius,
        0,
        Math.PI*2
    );


    ctx.fill();



    /*
       Kara delik
    */

    ctx.fillStyle =
        "#000";


    ctx.beginPath();


    ctx.arc(
        cx,
        cy,
        radius*.43,
        0,
        Math.PI*2
    );


    ctx.fill();



    /*
       Akresyon halkası
    */

    ctx.save();


    ctx.translate(
        cx,
        cy
    );


    ctx.rotate(
        -.16+
        rotationY*.08
    );


    const ringGradient =
        ctx.createLinearGradient(
            -radius,
            0,
            radius,
            0
        );


    ringGradient.addColorStop(
        0,
        "rgba(90,40,255,0)"
    );


    ringGradient.addColorStop(
        .25,
        "rgba(120,50,255,.55)"
    );


    ringGradient.addColorStop(
        .5,
        "rgba(255,210,120,.9)"
    );


    ringGradient.addColorStop(
        .75,
        "rgba(255,70,180,.5)"
    );


    ringGradient.addColorStop(
        1,
        "rgba(80,30,255,0)"
    );


    ctx.strokeStyle =
        ringGradient;


    ctx.lineWidth =
        radius*.08;


    ctx.beginPath();


    ctx.ellipse(
        0,
        0,
        radius*.85,
        radius*.28,
        0,
        0,
        Math.PI*2
    );


    ctx.stroke();


    ctx.restore();

}



/* =====================================================
   KÜÇÜK MESAJLAR
===================================================== */

function drawMessages(){

    const radius =
        Math.min(
            W,
            H
        )
        *
        .37;


    for(
        let i=0;
        i<messages.length;
        i++
    ){

        const m =
            messagePoints[i];


        const angle =
            m.angle+
            rotationY;


        const x =
            W/2+
            Math.cos(angle)
            *
            radius;


        const y =
            H/2+
            Math.sin(angle)
            *
            radius
            *
            .43;


        /*
           Arka taraftakiler
           daha soluk.
        */

        const depth =
            Math.sin(angle);


        const alpha =
            .32+
            (
                depth+1
            )
            *
            .25;


        /*
           Küçük yazı
        */

        ctx.font =
            "400 9px Arial";


        ctx.textAlign =
            "center";


        ctx.textBaseline =
            "middle";


        ctx.shadowColor =
            "rgba(160,90,255,.8)";


        ctx.shadowBlur =
            8;


        ctx.fillStyle =
            `rgba(
                255,
                255,
                255,
                ${alpha}
            )`;


        ctx.fillText(
            messages[i],
            x,
            y
        );


        ctx.shadowBlur=0;

    }

}



/* =====================================================
   ANİMASYON
===================================================== */

let previous =
    performance.now();


function animate(){

    const now =
        performance.now();


    const delta =
        now-
        previous;


    previous =
        now;


    /*
       Otomatik dönüş
    */

    if(
        autoRotation &&
        !touching
    ){

        targetY +=
            delta*
            .00015;

    }


    /*
       Yumuşak dönüş
    */

    rotationY +=

        (
            targetY-
            rotationY
        )
        *
        .07;


    rotationX +=

        (
            targetX-

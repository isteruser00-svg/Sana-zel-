<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no">

<title>Bizim Evrenimiz ❤️</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

body{
    touch-action:none;
    font-family:Arial,Helvetica,sans-serif;
}

#scene{
    position:fixed;
    inset:0;
}

canvas{
    display:block;
}

#intro{
    position:fixed;
    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    color:#ddd;

    font-size:clamp(18px,5vw,30px);

    letter-spacing:.18em;

    opacity:0;

    pointer-events:none;

    animation:intro 4.5s ease forwards;

    text-shadow:
        0 0 10px rgba(150,100,255,.4),
        0 0 30px rgba(150,80,255,.25);
}

@keyframes intro{

    0%{
        opacity:0;
        transform:translateY(10px);
    }

    20%{
        opacity:1;
        transform:translateY(0);
    }

    75%{
        opacity:1;
    }

    100%{
        opacity:0;
        transform:translateY(-10px);
    }
}

#hint{

    position:fixed;

    left:0;
    right:0;
    bottom:18px;

    text-align:center;

    color:rgba(255,255,255,.45);

    font-size:11px;

    letter-spacing:.08em;

    pointer-events:none;

    transition:opacity .8s;
}

#message{

    position:fixed;

    z-index:20;

    left:50%;
    top:50%;

    width:min(88vw,520px);

    padding:30px 22px;

    transform:
        translate(-50%,-50%)
        scale(.75);

    opacity:0;

    pointer-events:none;

    text-align:center;

    color:white;

    font-size:clamp(22px,7vw,42px);

    line-height:1.25;

    border:
        1px solid
        rgba(255,255,255,.18);

    border-radius:24px;

    background:
        rgba(7,5,15,.9);

    backdrop-filter:blur(15px);

    box-shadow:
        0 0 30px rgba(130,70,255,.2),
        0 0 100px rgba(130,70,255,.15);

    transition:
        opacity .25s ease,
        transform .25s ease;
}

#message.show{

    opacity:1;

    transform:
        translate(-50%,-50%)
        scale(1);

    pointer-events:auto;
}

#message small{

    display:block;

    margin-top:16px;

    color:rgba(255,255,255,.4);

    font-size:11px;

    letter-spacing:.05em;
}
</style>
</head>

<body>

<div id="scene"></div>

<div id="intro">
    EVRENİNDE BİR SIR VAR...
</div>

<div id="message"></div>

<div id="hint">
    GALAKSİYİ PARMAĞINLA DÖNDÜR • MESAJLARA DOKUN
</div>


<!-- Three.js -->
<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>


<script>

(() => {

    /* =====================================================
       BURADAN MESAJLARI DEĞİŞTİREBİLİRSİN
    ===================================================== */

    const messages = [

        "SENİ SEVİYORUM ❤️",

        "İYİ Kİ HAYATIMA GİRDİN ✨",

        "İYİ Kİ VARSIN 💜",

        "SEN BENİM EN GÜZEL TESADÜFÜMSÜN 🌙",

        "SENİNLE HER ŞEY DAHA GÜZEL ♡"

    ];


    /* =====================================================
       SAHNE
    ===================================================== */

    const scene = new THREE.Scene();


    const camera =
        new THREE.PerspectiveCamera(
            55,
            innerWidth / innerHeight,
            0.1,
            1000
        );


    camera.position.set(
        0,
        2.2,
        13
    );


    const renderer =
        new THREE.WebGLRenderer({
            antialias:true
        });


    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            2
        )
    );


    renderer.setSize(
        innerWidth,
        innerHeight
    );


    renderer.setClearColor(
        0x000000,
        1
    );


    document
        .getElementById("scene")
        .appendChild(renderer.domElement);



    /* =====================================================
       YILDIZLAR
    ===================================================== */

    const starCount = 4500;

    const starPositions =
        new Float32Array(
            starCount * 3
        );


    for(
        let i = 0;
        i < starCount;
        i++
    ){

        const radius =
            30 +
            Math.random() * 65;


        const angle =
            Math.random() *
            Math.PI * 2;


        starPositions[i * 3] =
            Math.cos(angle) * radius;


        starPositions[i * 3 + 1] =
            Math.sin(angle) * radius;


        starPositions[i * 3 + 2] =
            (Math.random() - .5) * 55;
    }


    const starGeometry =
        new THREE.BufferGeometry();


    starGeometry.setAttribute(
        "position",
        new THREE.BufferAttribute(
            starPositions,
            3
        )
    );


    const starMaterial =
        new THREE.PointsMaterial({

            color:0xffffff,

            size:.055,

            transparent:true,

            opacity:.8,

            sizeAttenuation:true

        });


    const stars =
        new THREE.Points(
            starGeometry,
            starMaterial
        );


    scene.add(stars);



    /* =====================================================
       SPİRAL GALAKSİ
    ===================================================== */

    const particleCount = 14000;


    const positions =
        new Float32Array(
            particleCount * 3
        );


    const colors =
        new Float32Array(
            particleCount * 3
        );


    for(
        let i = 0;
        i < particleCount;
        i++
    ){

        const radius =
            Math.pow(
                Math.random(),
                .72
            ) * 6.8;


        const arm =
            Math.floor(
                Math.random() * 5
            );


        const angle =

            arm *
            Math.PI *
            2 /
            5

            +

            radius *
            1.35

            +

            (
                Math.random() - .5
            )
            *
            (
                .35 +
                radius * .1
            );


        const thickness =

            (
                Math.random() - .5
            )
            *
            (
                .18 +
                radius * .065
            );


        positions[i * 3] =
            Math.cos(angle) *
            radius;


        positions[i * 3 + 1] =

            Math.sin(angle) *
            radius *
            (
                .50 +
                radius * .025
            );


        positions[i * 3 + 2] =
            thickness;



        const randomColor =
            Math.random();


        /* Mor */
        if(randomColor < .55){

            colors[i * 3] =
                .65;

            colors[i * 3 + 1] =
                .32;

            colors[i * 3 + 2] =
                1;

        }

        /* Pembe */
        else if(randomColor < .83){

            colors[i * 3] =
                1;

            colors[i * 3 + 1] =
                .42;

            colors[i * 3 + 2] =
                .75;

        }

        /* Altın */
        else{

            colors[i * 3] =
                1;

            colors[i * 3 + 1] =
                .8;

            colors[i * 3 + 2] =
                .4;
        }

    }


    const galaxyGeometry =
        new THREE.BufferGeometry();


    galaxyGeometry.setAttribute(
        "position",
        new THREE.BufferAttribute(
            positions,
            3
        )
    );


    galaxyGeometry.setAttribute(
        "color",
        new THREE.BufferAttribute(
            colors,
            3
        )
    );


    const galaxyMaterial =
        new THREE.PointsMaterial({

            size:.047,

            vertexColors:true,

            transparent:true,

            opacity:.95,

            blending:
                THREE.AdditiveBlending,

            depthWrite:false,

            sizeAttenuation:true

        });


    const galaxy =
        new THREE.Points(
            galaxyGeometry,
            galaxyMaterial
        );


    galaxy.rotation.x =
        -.22;


    scene.add(galaxy);



    /* =====================================================
       KARA DELİK
    ===================================================== */

    const blackHole =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                1.05,
                48,
                48
            ),

            new THREE.MeshBasicMaterial({
                color:0x020106
            })

        );


    scene.add(
        blackHole
    );


    /* =====================================================
       MERKEZ IŞIĞI
    ===================================================== */

    const glow =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                1.5,
                32,
                32
            ),

            new THREE.MeshBasicMaterial({

                color:0x8b4dff,

                transparent:true,

                opacity:.11,

                blending:
                    THREE.AdditiveBlending,

                depthWrite:false

            })

        );


    scene.add(
        glow
    );



    /* =====================================================
       PARLAK HALKA
    ===================================================== */

    const ring =
        new THREE.Mesh(

            new THREE.RingGeometry(
                1.15,
                2.05,
                128
            ),

            new THREE.MeshBasicMaterial({

                color:0xc27cff,

                transparent:true,

                opacity:.28,

                side:
                    THREE.DoubleSide,

                blending:
                    THREE.AdditiveBlending,

                depthWrite:false

            })

        );


    ring.rotation.x =
        Math.PI / 2.18;


    scene.add(
        ring
    );



    /* =====================================================
       MESAJLAR
    ===================================================== */

    const messageObjects = [];


    function createTextTexture(text){

        const canvas =
            document.createElement(
                "canvas"
            );


        canvas.width =
            1024;

        canvas.height =
            256;


        const ctx =
            canvas.getContext(
                "2d"
            );


        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        ctx.font =
            "500 54px Arial";


        ctx.textAlign =
            "center";


        ctx.textBaseline =
            "middle";


        ctx.shadowColor =
            "#b77cff";


        ctx.shadowBlur =
            22;


        ctx.fillStyle =
            "#ffffff";


        ctx.fillText(
            text,
            512,
            128
        );


        return new THREE.CanvasTexture(
            canvas
        );
    }



    messages.forEach(
        (text,index) => {

            const material =
                new THREE.SpriteMaterial({

                    map:
                        createTextTexture(
                            text
                        ),

                    transparent:true,

                    depthWrite:false,

                    blending:
                        THREE.AdditiveBlending,

                    opacity:.9

                });


            const sprite =
                new THREE.Sprite(
                    material
                );


            sprite.scale.set(
                4.5,
                1,
                1
            );


            sprite.userData = {
                text:text,
                index:index
            };


            scene.add(
                sprite
            );


            messageObjects.push(
                sprite
            );

        }
    );



    /* =====================================================
       DOKUNMA / MOUSE KONTROLÜ
    ===================================================== */

    let targetRotationY = 0;

    let targetRotationX =
        .12;

    let rotationY = 0;

    let rotationX =
        .12;


    let dragging =
        false;


    let moved =
        false;


    let startX = 0;

    let startY = 0;

    let lastX = 0;

    let lastY = 0;


    let velocity =
        .0015;


    const raycaster =
        new THREE.Raycaster();


    const pointer =
        new THREE.Vector2();


    const messageBox =
        document.getElementById(
            "message"
        );


    const hint =
        document.getElementById(
            "hint"
        );



    function setPointer(event){

        const rect =
            renderer.domElement
                .getBoundingClientRect();


        pointer.x =
            (
                (
                    event.clientX -
                    rect.left
                )
                /
                rect.width
            )
            *
            2
            -
            1;


        pointer.y =
            -
            (
                (
                    event.clientY -
                    rect.top
                )
                /
                rect.height
            )
            *
            2
            +
            1;

    }



    renderer.domElement
        .addEventListener(
            "pointerdown",
            event => {

                dragging =
                    true;

                moved =
                    false;


                startX =
                    lastX =
                    event.clientX;


                startY =
                    lastY =
                    event.clientY;


                velocity =
                    0;


                hint.style.opacity =
                    "0";

            }
        );



    renderer.domElement
        .addEventListener(
            "pointermove",
            event => {

                if(!dragging)
                    return;


                const dx =
                    event.clientX -
                    lastX;


                const dy =
                    event.clientY -
                    lastY;


                if(
                    Math.abs(
                        event.clientX -
                        startX
                    )
                    +
                    Math.abs(
                        event.clientY -
                        startY
                    )
                    >
                    8
                ){

                    moved =
                        true;
                }


                targetRotationY +=
                    dx * .006;


                targetRotationX +=
                    dy * .004;


                targetRotationX =
                    Math.max(
                        -.9,
                        Math.min(
                            .9,
                            targetRotationX
                        )
                    );


                velocity =
                    dx * .0008;


                lastX =
                    event.clientX;


                lastY =
                    event.clientY;

            }
        );



    renderer.domElement
        .addEventListener(
            "pointerup",
            event => {

                dragging =
                    false;


                /*
                 Eğer sürükleme yapıldıysa
                 mesaj açma.
                */

                if(moved)
                    return;


                setPointer(
                    event
                );


                raycaster
                    .setFromCamera(
                        pointer,
                        camera
                    );


                const hits =
                    raycaster.intersectObjects(
                        messageObjects
                    );


                if(hits.length){

                    messageBox.innerHTML =

                        hits[0]
                            .object
                            .userData
                            .text

                        +

                        "<small>" +
                        "Kapatmak için başka yere dokun" +
                        "</small>";


                    messageBox
                        .classList
                        .add("show");

                }

                else{

                    messageBox
                        .classList
                        .remove("show");

                }

            }
        );



    messageBox
        .addEventListener(
            "pointerdown",
            event => {

                event.stopPropagation();

            }
        );



    /* =====================================================
       EKRAN BOYUTU
    ===================================================== */

    window.addEventListener(
        "resize",
        () => {

            camera.aspect =
                innerWidth /
                innerHeight;


            camera.updateProjectionMatrix();


            renderer.setSize(
                innerWidth,
                innerHeight
            );

        }
    );



    /* =====================================================
       ANİMASYON
    ===================================================== */

    let time = 0;


    function animate(){

        requestAnimationFrame(
            animate
        );


        time += .01;



        /*
         * Parmağı bırakınca
         * otomatik dönmeye devam eder.
         */

        if(!dragging){

            targetRotationY +=
                velocity +
                .0007;


            velocity *=
                .985;

        }



        rotationY +=
            (
                targetRotationY -
                rotationY
            )
            *
            .08;


        rotationX +=
            (
                targetRotationX -
                rotationX
            )
            *
            .08;



        galaxy.rotation.y =
            rotationY;


        galaxy.rotation.x =
            -.22 +
            rotationX * .35;



        ring.rotation.z =
            time * .12 +
            rotationY;



        /*
         * Merkezde hafif nefes alma efekti
         */

        const pulse =
            1 +
            Math.sin(
                time * 1.7
            )
            *
            .035;


        glow.scale.setScalar(
            pulse
        );



        /*
         * Mesajları galaksinin
         * çevresinde döndür
         */

        messageObjects.forEach(
            (sprite,index) => {

                const angle =

                    index /
                    messages.length *
                    Math.PI *
                    2

                    +

                    .35;


                const radius =
                    3.3 +
                    (index % 2);


                const x =
                    Math.cos(angle) *
                    radius;


                const y =
                    Math.sin(angle) *
                    radius *
                    .52;


                const z =
                    (index % 2 - .5)
                    *
                    .55;



                const cos =
                    Math.cos(
                        rotationY
                    );


                const sin =
                    Math.sin(
                        rotationY
                    );



                sprite.position.x =
                    x * cos -
                    z * sin;


                sprite.position.z =
                    x * sin +
                    z * cos;


                sprite.position.y =
                    y;


                sprite.material.opacity =

                    .72 +

                    .18 *
                    Math.sin(
